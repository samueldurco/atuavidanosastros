name: dated-horoscope

on:
  schedule:
    # Prepare the next edition well before the day changes in Brasília, then retry two hours later.
    - cron: "15 20,22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap today or yesterday (archive recovery), or prepare the next period in Brasília
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, next, bootstrap-yesterday]
      delivery:
        description: Update the live readings, or produce a signed artifact only
        required: true
        default: live
        type: choice
        options: [live, signed-artifact]

permissions:
  contents: read

concurrency:
  group: dated-horoscope-publication
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'samueldurco/atuavidanosastros' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: atvna-editorial-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare finite period batch
        env:
          BATCH_MODE: ${{ inputs.mode || 'next' }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/dated-horoscope-workflow.mjs prepare output/dated-horoscope-prepared
      - name: Reproduce, verify and sign with existing external custody
        env:
          ATVNA_EDITORIAL_SIGNING_KEY: ${{ secrets.ATVNA_EDITORIAL_SIGNING_KEY }}
        run: node --experimental-strip-types scripts/dated-horoscope-authority.mjs output/dated-horoscope-prepared/index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-dated-horoscope
          path: output/dated-horoscope-signed.json
          retention-days: 7
      - name: Report exact coverage and pending publication
        env:
          BATCH_DELIVERY: ${{ inputs.delivery || 'live' }}
        run: node scripts/dated-horoscope-workflow.mjs summary output/dated-horoscope-prepared/index.json

  publish:
    needs: sign
    if: github.event_name == 'schedule' || inputs.delivery == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download public signed package from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-dated-horoscope --dir output
      - name: Admit and publish the signed readings
        run: |
          content="$RUNNER_TEMP/horoscope-content"
          if git ls-remote --exit-code --heads origin refs/heads/horoscope-content; then
            git fetch --no-tags origin refs/heads/horoscope-content
            git worktree add --detach "$content" FETCH_HEAD
          else
            status=$?
            test "$status" -eq 2
            git worktree add --detach "$content" HEAD
            git -C "$content" switch --orphan horoscope-content
          fi
          node --experimental-strip-types scripts/publish-live-horoscope.mjs output/dated-horoscope-signed.json "$content"
          git -C "$content" add --all
          if ! git -C "$content" diff --cached --quiet; then
            git -C "$content" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "[skip ci] Publica a edição assinada do horóscopo"
            git -C "$content" push origin HEAD:refs/heads/horoscope-content
          fi
