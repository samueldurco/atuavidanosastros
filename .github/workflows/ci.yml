name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit requested by the dated editorial publisher
        type: string
        required: true

permissions:
  contents: read

jobs:
  dispatch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Bind dispatched checks to the requested commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] && [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]
          fi

  quality:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependency advisories
        run: pnpm audit --audit-level=low
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm build:trial-runtime
      - run: pnpm build:free-tools-runtime

  accessibility:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    # 196 browser checks plus the isolated legal/social build exceeded 15 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Render externally signed editorial candidates before admission
        run: pnpm --dir apps/web exec vitest run src/lib/server/editorial-release.spec.ts
      - name: Editorial candidate Gate B and public SEO
        run: pnpm --dir apps/web exec playwright test editorial-candidates.e2e.ts seo.e2e.ts articles-discovery.e2e.ts --workers=1
      - name: Public and synthetic private accessibility with keyboard regression
        env:
          WRANGLER_LOG: debug
        run: pnpm --dir apps/web exec playwright test approved-home.e2e.ts public-accessibility.e2e.ts public-menu.e2e.ts navigation-catalog.e2e.ts free-tools.e2e.ts free-tools-privacy.e2e.ts private-accessibility.e2e.ts gate-b.e2e.ts consent-reflow.e2e.ts city-location.e2e.ts product-test-index.e2e.ts private-trials.e2e.ts dream-atlas-private.e2e.ts trial-access.e2e.ts visual-v3.e2e.ts reconstruction.e2e.ts tarot-reconstruction.e2e.ts reconstruction-dossier.e2e.ts reconstruction-horoscope.e2e.ts reconstruction-week.e2e.ts reconstruction-atlas.e2e.ts reconstruction-compass.e2e.ts reconstruction-pillars.e2e.ts reconstruction-birth.e2e.ts reconstruction-ascendant.e2e.ts reconstruction-midheaven.e2e.ts --workers=1
      - name: Reconstructed public horoscope and consented ATV+ base
        run: pnpm --dir apps/web exec playwright test public-horoscope-reconstruction.e2e.ts club-continuity.e2e.ts --workers=1
      - name: Legal documents and TikTok endpoint isolation
        run: pnpm --dir apps/web exec playwright test --config=playwright.social.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: accessibility-results
          path: |
            apps/web/test-results/
            ~/.config/.wrangler/logs/
          include-hidden-files: true
          retention-days: 7

  user-area:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Dashboard, library, readers and consented continuity recovery
        run: pnpm --dir apps/web exec playwright test dashboard.e2e.ts library-reader.e2e.ts library-pagination.e2e.ts library-reader-return.e2e.ts continuity.e2e.ts continuity-access.e2e.ts signout.e2e.ts --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: user-area-results
          path: apps/web/test-results/
          retention-days: 7

  secrets:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  current-readings:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: All current offers on mobile and desktop, calendar navigation and free tools
        env:
          ATV_E2E_EVIDENCE_DIR: test-results/current-reading-evidence
        run: pnpm --dir apps/web exec playwright test current-readings-matrix.e2e.ts reconstruction-calendar.e2e.ts free-tools.e2e.ts --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: current-reading-results
          path: apps/web/test-results/
          retention-days: 7

  sbom:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ./pnpm-lock.yaml
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: atvna-dependencies.spdx.json
          upload-release-assets: false
      - run: node scripts/validate-sbom.mjs sbom.spdx.json
