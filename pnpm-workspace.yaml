packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - supabase

# Security fixes for transitives pinned by the current upstream packages.
overrides:
  'miniflare>sharp': 0.35.5
  'miniflare>undici': 7.29.1
  source-map-js: 1.2.2
  postcss-selector-parser: 7.1.6
