packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - supabase

# Security fixes for transitives pinned by the current upstream packages.
overrides:
  "miniflare>sharp": 0.35.5
  "miniflare>undici": 7.30.1
  source-map-js: 1.2.2
  postcss-selector-parser: 7.1.6
  "@sveltejs/vite-plugin-svelte@7.3.0>deepmerge": "-"

# Replace the unpatched config merge implementation (GHSA-gcqx-w48m-w2h4).
packageExtensions:
  "@sveltejs/vite-plugin-svelte@7.3.0":
    dependencies:
      "@fastify/deepmerge": 3.2.4

patchedDependencies:
  "@sveltejs/vite-plugin-svelte@7.3.0": patches/@sveltejs__vite-plugin-svelte@7.3.0.patch
